<!doctype html>
<meta charset="utf-8">
<title>Town 2x layout (placeholder)</title>
<style>html,body{margin:0;background:#222}canvas{display:block;image-rendering:pixelated}</style>
<canvas id="c"></canvas>
<script src="buildings.js"></script>
<script>/* art is never scaled: drawn at native size, bottom-centre on the slot anchor */
function drawNative(im, x, y, w, h) { g.drawImage(im, Math.round(x + w / 2 - im.naturalWidth / 2), y + h - im.naturalHeight); }</script>
<script src="assets.js"></script>
<script>
const T = window.TOWN2X, W = T.canvas.w, H = T.canvas.h, SP = T.SPRITE, B = T.buildings;
const q = new URLSearchParams(location.search);
const scale = parseFloat(q.get('scale') || '1');
const V = T.viewport, VIEW = q.get('view') === '1';  // ?view=1: open at the initial viewport
const CVW = VIEW ? V.w : W, CVH = VIEW ? V.h : H;
const cv = document.getElementById('c'); cv.width = CVW; cv.height = CVH;
cv.style.width = CVW * scale + 'px'; cv.style.height = CVH * scale + 'px';
const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
const CELL = 8;

// Art slots: assets.json (as assets.js) lists every building/lot/prop with the png to draw at its footprint.
// A png that loads is drawn; a missing one gets a labelled placeholder. window.__slotState[id] = 'art' | 'placeholder'.
const AM = {}, PROPS = [];
for (const a of window.TOWN_ASSETS.assets) { AM[a.id] = a; if (a.kind === 'prop') PROPS.push(a); }
window.__slotState = {};
const artOf = a => (a && a.im && a.im.complete && a.im.naturalWidth > 0) ? a.im : null;
function placeholder(a, fill) {
  const f = a.footprint; window.__overlay[a.id] = true;
  if (fill) { g.fillStyle = fill; g.fillRect(f.x, f.y, f.w, f.h); }
  g.setLineDash([20, 12]); g.strokeStyle = '#fff'; g.lineWidth = 4; g.strokeRect(f.x + 2, f.y + 2, f.w - 4, f.h - 4); g.setLineDash([]);
  const s = a.label || a.id; g.font = 'bold 32px sans-serif';
  if (g.measureText(s).width <= f.w - 48) label(s, f.x + 24, f.y + f.h / 2 - 28, 32);
  else s.split(' (').forEach((t, i) => label(i ? '(' + t : t, f.x + 12, f.y + 24 + i * 30, 22));
  label('art pending', f.x + 24, f.y + f.h / 2 + 12, f.w > 300 ? 28 : 20, '#ffd');
}

// Sprite stands in front of a building once its feet are at or below the building's base line, so the
// blocked area of a building is its footprint minus the bottom SPRITE.h (same rule as tools/checks/layout2x.py).
function blocked(fx, fy) {
  const l = fx - SP.w / 2, r = fx + SP.w / 2, t = fy - SP.h;
  if (l < 0 || r > W || t < 0 || fy > H) return true;
  return B.some(b => l < b.x + b.w && r > b.x && t < b.y + b.h - SP.h && fy > b.y);
}
function door(b) { return { x: b.x + b.door.x + b.door.w / 2, y: Math.max(b.y + b.door.y + b.door.h, b.y + b.h) + 4 }; }
function bfs(s, e) {
  const cw = Math.ceil(W / CELL), ch = Math.ceil(H / CELL), key = (i, j) => j * cw + i;
  const si = Math.round(s.x / CELL), sj = Math.round(s.y / CELL), ei = Math.round(e.x / CELL), ej = Math.round(e.y / CELL);
  const prev = new Map([[key(si, sj), -1]]), qu = [[si, sj]];
  for (let k = 0; k < qu.length; k++) {
    const [i, j] = qu[k];
    if (i === ei && j === ej) break;
    for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const a = i + di, b2 = j + dj, kk = key(a, b2);
      if (a < 0 || b2 < 0 || a >= cw || b2 >= ch || prev.has(kk) || blocked(a * CELL, b2 * CELL)) continue;
      prev.set(kk, key(i, j)); qu.push([a, b2]);
    }
  }
  if (!prev.has(key(ei, ej))) return [];
  const path = []; for (let k = key(ei, ej); k !== -1; k = prev.get(k)) path.push({ x: (k % cw) * CELL, y: Math.floor(k / cw) * CELL });
  return path.reverse();
}

const MAP = q.get('map') === '1', SQ = T.square;
const DEBUG = q.get('debug') === '1' || MAP;  // outlines, size labels and door boxes only in debug (?debug=1, and the ?map=1 layout diagram)
const TINT = { residential: '#d98fb0', civic: '#e8c75a', working: '#6fa8dc', pub: '#e08a3c', park: '#7fd06a', library: '#b48ae0' };
function label(t, x, y, size, col) {
  g.font = `bold ${size}px sans-serif`; g.textBaseline = 'top'; g.lineWidth = size / 5; g.strokeStyle = '#000'; g.strokeText(t, x, y);
  g.fillStyle = col || '#fff'; g.fillText(t, x, y);
}
function paths() {
  g.fillStyle = '#c9b98a';
  for (const r of [...T.streets, ...T.spokes]) g.fillRect(r.x, r.y, r.w, r.h);
  const PK = B.find(b => b.id === 'park');
  if (PK) { g.fillStyle = '#4f8a35'; g.fillRect(PK.x, PK.y, PK.w, PK.h); g.fillStyle = '#2f6a25'; for (let y = PK.y + 80; y <= PK.y + PK.h - 60; y += 160) for (let x = PK.x + 60; x <= PK.x + PK.w - 60; x += 125) { g.beginPath(); g.arc(x, y, 34, 0, 7); g.fill(); } }
  for (const r of T.reserve || []) { g.setLineDash([24, 16]); g.strokeStyle = '#ffe9a8'; g.lineWidth = 4; g.strokeRect(r.x + 2, r.y + 2, r.w - 4, r.h - 4); g.setLineDash([]); label(r.label, r.x + 20, r.y + r.h / 2 - 16, 28, '#ffe9a8'); }
  const PZ = T.plaza;  // teleport plaza: paved ground filling the block beside the pub; the small base sits on it
  if (PZ) { g.fillStyle = '#b9b4a6'; g.fillRect(PZ.x, PZ.y, PZ.w, PZ.h); g.strokeStyle = '#6f6a5c'; g.lineWidth = 4; g.strokeRect(PZ.x + 2, PZ.y + 2, PZ.w - 4, PZ.h - 4);
    g.fillStyle = '#a7a294'; for (let y = PZ.y + 24; y < PZ.y + PZ.h - 8; y += 48) for (let x = PZ.x + 24 + (((y - PZ.y) / 48) % 2) * 24; x < PZ.x + PZ.w - 8; x += 48) g.fillRect(x, y, 20, 20); }
  g.fillStyle = '#d9cfa8'; g.fillRect(SQ.x, SQ.y, SQ.w, SQ.h);
  for (const r of T.patios || []) { g.fillStyle = '#cdb48a'; g.fillRect(r.x, r.y, r.w, r.h); g.setLineDash([10, 6]); g.strokeStyle = '#7a5a2e'; g.lineWidth = 3; g.strokeRect(r.x + 1.5, r.y + 1.5, r.w - 3, r.h - 3); g.setLineDash([]); }
  g.strokeStyle = '#8a7a50'; g.lineWidth = 4; g.strokeRect(SQ.x, SQ.y, SQ.w, SQ.h);
}
// district label: shrink to fit the district, and drop it to the bottom edge when the top one would cover a building
function distLabel(d) {
  const s = d.label.toUpperCase(); let size = 56; g.font = `bold ${size}px sans-serif`;
  while (size > 24 && g.measureText(s).width > d.w - 48) { size -= 4; g.font = `bold ${size}px sans-serif`; }
  const w = g.measureText(s).width, hits = y => B.some(b => b.x < d.x + 24 + w && b.x + b.w > d.x + 24 && b.y < y + size && b.y + b.h > y);
  let y = d.y + 16; if (hits(y) && !hits(d.y + d.h - size - 16)) y = d.y + d.h - size - 16;
  label(s, d.x + 24, y, size, TINT[d.id]);
}
function mapOverlay() {
  g.globalAlpha = .28;
  for (const d of T.districts) { g.fillStyle = TINT[d.id] || '#fff'; g.fillRect(d.x, d.y, d.w, d.h); }
  g.globalAlpha = 1; g.setLineDash([]); g.lineWidth = 6;
  for (const d of T.districts) { g.strokeStyle = TINT[d.id] || '#fff'; g.strokeRect(d.x + 3, d.y + 3, d.w - 6, d.h - 6); distLabel(d); }
  label('Town square', SQ.x + 240, SQ.y + 60, 80);
  for (const r of T.patios || []) label(r.label, r.x + 4, r.y + 4, 18, '#fff');
  if (T.plaza) label('plaza ' + T.plaza.w + 'x' + T.plaza.h, T.plaza.x + 16, T.plaza.y + T.plaza.h - 44, 28, '#fff');
  g.setLineDash([40, 20]); g.lineWidth = 14; g.strokeStyle = '#000'; g.strokeRect(V.x + 8, V.y + 8, V.w - 16, V.h - 16);
  g.lineWidth = 8; g.strokeStyle = '#ff3030'; g.strokeRect(V.x + 8, V.y + 8, V.w - 16, V.h - 16); g.setLineDash([]);
  { const s = `Initial view ${V.w}x${V.h} (zoom ${V.zoom})`; g.font = 'bold 56px sans-serif'; label(s, V.x + V.w - g.measureText(s).width - 40, V.y + V.h - 90, 56, '#ff6060'); }
  for (const r of T.streets) { const s = r.id.replace('_', ' ') + ' (path)'; g.font = 'bold 40px sans-serif'; label(s, r.x + r.w / 2 - g.measureText(s).width / 2, r.y + r.h / 2 - 20, 40, '#3a2f10'); }
  for (const r of T.spokes) if (r.id !== 'pub_door') label('path', r.x + r.w / 2 - 40, r.y + (r.h > r.w ? Math.min(r.h / 2, 300) : r.h / 2) - 16, 32, '#3a2f10');
  g.setLineDash([14, 10]);
  for (const b of B) {
    if (b.slot) { g.strokeStyle = '#00e5ff'; g.lineWidth = 4; g.strokeRect(b.x + b.slot.x, b.y + b.slot.y, b.slot.w, b.slot.h); label('slot ' + b.slot.w + 'x' + b.slot.h, b.x + b.slot.x + 10, b.y + b.slot.y + 8, 28, '#00e5ff'); }
  }
  g.setLineDash([]);
}

function draw(spr) {
  g.setTransform(1, 0, 0, 1, VIEW ? -V.x : 0, VIEW ? -V.y : 0);
  g.fillStyle = '#5c8f3e'; g.fillRect(0, 0, W, H);
  window.__overlay = {};
  paths();
  let pending = B.length;
  for (const b of B) {
    if (b.kind === 'lot') {
      const a = AM[b.id], im = artOf(a);
      window.__slotState[b.id] = im ? 'art' : 'placeholder';
      if (im) drawNative(im, b.x, b.y, b.w, b.h);
      else if (MAP && T.districts.some(d => d.id === b.id)) { g.setLineDash([20, 12]); g.strokeStyle = '#fff'; g.lineWidth = 4; g.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4); g.setLineDash([]); }  // map: the district label already names it
      else placeholder(a);
      if (b.slot && DEBUG) { g.setLineDash([14, 10]); g.strokeStyle = '#00e5ff'; g.lineWidth = 3; g.strokeRect(b.x + b.slot.x, b.y + b.slot.y, b.slot.w, b.slot.h); g.setLineDash([]); }
      continue;
    }
    const im = artOf(AM[b.id]); window.__slotState[b.id] = im ? 'art' : 'placeholder';
    if (im) drawNative(im, b.x, b.y, b.w, b.h);
    else placeholder(AM[b.id], '#8a7a9a');
    if (im && !DEBUG) continue;  // real art: no label, outline or door box on top
    window.__overlay[b.id] = true;
    g.strokeStyle = '#ff0'; g.lineWidth = 1; g.strokeRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1);
    { const s = `${b.label || b.id} ${b.w}x${b.h}`; g.font = '14px monospace'; g.textBaseline = 'top';
      g.fillStyle = '#000'; g.fillRect(b.x + 6, b.y + 6, Math.min(b.w - 12, g.measureText(s).width + 8), 20); g.fillStyle = '#fff'; g.fillText(s, b.x + 10, b.y + 9); }
    const dx = b.x + b.door.x, dy = b.y + b.door.y;   // outer door frame
    g.strokeStyle = '#000'; g.lineWidth = 6; g.strokeRect(dx, dy, b.door.w, b.door.h);
    g.strokeStyle = '#ff2bd6'; g.lineWidth = 2; g.strokeRect(dx, dy, b.door.w, b.door.h);
    const cx = dx + b.door.w / 2, by = dy + b.door.h;  // threshold tick
    g.fillStyle = '#ff2bd6'; g.fillRect(cx - 14, by, 28, 2); g.fillRect(cx - 1, by, 2, 8);
  }
  for (const a of PROPS) {
    const im = artOf(a); window.__slotState[a.id] = im ? 'art' : 'placeholder';
    if (im) drawNative(im, a.footprint.x, a.footprint.y, a.footprint.w, a.footprint.h); else placeholder(a);
  }
  if (MAP) mapOverlay();
  if (spr) {
    g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(spr.x, spr.y, 24, 6, 0, 0, 7); g.fill();
    g.fillStyle = '#e2572b'; g.strokeStyle = '#111'; g.lineWidth = 2;
    g.beginPath(); g.roundRect(spr.x - 24, spr.y - SP.h, SP.w, SP.h, 24); g.fill(); g.stroke();
    g.fillStyle = '#fff'; g.fillRect(spr.x - 10, spr.y - SP.h + 22, 6, 6); g.fillRect(spr.x + 4, spr.y - SP.h + 22, 6, 6);
  }
}
const target = id => B.find(b => b.id === id && b.door);
let spr = { ...T.spawn }, left = window.TOWN_ASSETS.assets.length;
function ready() { window.layoutReady = true; }
function start() {
  const at = q.get('at'), walk = q.get('walk');
  if (at && target(at)) spr = door(target(at));
  else if (walk && target(walk)) {
    const path = bfs(T.spawn, door(target(walk))); let i = 0; spr = { ...T.spawn };
    window.walkPath = path;
    (function step() { if (i < path.length) { spr = path[i]; i += 2; draw(spr); requestAnimationFrame(step); } })();
  }
  draw(spr); ready();
}
for (const a of window.TOWN_ASSETS.assets) {
  a.im = new Image(); a.im.onload = a.im.onerror = () => { if (--left === 0) start(); }; a.im.src = '../' + a.png;
}
if (!left) start();
</script>
